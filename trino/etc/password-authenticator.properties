# ใครเป็นใคร (authentication): Trino ลอง bind เข้า LDAP ด้วยชื่อ + รหัสที่ผู้ใช้กรอก ผ่าน = login ได้
#   ลองหาใน ou=people (คน) ก่อน แล้วค่อย ou=services (service account เช่น airflow)
password-authenticator.name=ldap
ldap.url=ldap://openldap:389
# ห้องเรียนคุยกับ LDAP แบบไม่เข้ารหัส · prod ใช้ ldaps://...:636 + ldap.ssl.truststore.path
ldap.allow-insecure=true
ldap.user-bind-pattern=uid=${USER},ou=people,dc=dataplatform,dc=local:uid=${USER},ou=services,dc=dataplatform,dc=local
# จำผลการ login 5 นาที (ไม่ต้องถาม LDAP ทุก query) · ลบ / เปลี่ยนรหัสใน LDAP แล้วมีผลภายใน 5 นาที
ldap.cache-ttl=5m
