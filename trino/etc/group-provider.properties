# ผู้ใช้อยู่กลุ่มไหน: Trino ค้นใน LDAP ว่ากลุ่มใดมี member = ผู้ใช้คนนี้ แล้วส่งชื่อกลุ่มให้ OPA
#   ค้นด้วยบัญชี uid=trino ที่อ่านได้อย่างเดียว (ไม่ใช้ cn=root ของ LDAP)
group-provider.name=ldap
ldap.url=ldap://openldap:389
ldap.allow-insecure=true
ldap.admin-user=uid=trino,ou=services,dc=dataplatform,dc=local
ldap.admin-password=${ENV:LDAP_BIND_PASSWORD}
ldap.user-base-dn=dc=dataplatform,dc=local
ldap.user-search-filter=(uid={0})
ldap.use-group-filter=true
ldap.group-base-dn=ou=groups,dc=dataplatform,dc=local
ldap.group-search-filter=(objectClass=groupOfNames)
ldap.group-search-member-attribute=member
ldap.group-name-attribute=cn
