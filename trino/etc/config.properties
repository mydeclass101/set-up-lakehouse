# config ของ Trino server (เครื่องเดียว: coordinator ทำหน้าที่ worker ด้วย)
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}
cache-manager.config-files=etc/cache-manager-memory.properties

# HTTPS ที่ port 8443 (cert สร้างโดย trino-certs) · ผู้ใช้ทุกคนต้องเข้าทาง HTTPS
# port 8080 (HTTP) ยังเปิดในเครื่องสำหรับ health check และการคุยกันภายใน แต่ login ผ่าน HTTP ไม่ได้
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/certs/keystore.p12
http-server.https.keystore.key=${ENV:TRINO_KEYSTORE_PASSWORD}

# login ด้วยรหัสผ่าน → ตรวจกับ LDAP (password-authenticator.properties)
http-server.authentication.type=PASSWORD
# เปิด authentication แล้วต้องมี secret ให้ coordinator / worker เชื่อกัน (prod: เก็บใน secrets manager)
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
