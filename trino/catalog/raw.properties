# ไฟล์ดิบใน bucket raw (CSV จาก partner, JSON จาก API) ให้ query เป็นตารางได้
# สมุดรายชื่อตาราง (metastore) เก็บเป็นไฟล์ใน RustFS เอง ไม่ต้องมี Hive Metastore server
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=s3://raw/_trino_metastore
fs.s3.enabled=true
s3.endpoint=http://rustfs:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:RUSTFS_ACCESS_KEY}
s3.aws-secret-key=${ENV:RUSTFS_SECRET_KEY}
