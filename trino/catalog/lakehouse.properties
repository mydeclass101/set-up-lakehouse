# Iceberg บน RustFS (silver / gold / bronze ของร้าน) · อ่านและเขียนได้
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://rustfs:9000/iceberg
iceberg.rest-catalog.warehouse=lakehouse
iceberg.rest-catalog.security=SIGV4
iceberg.rest-catalog.signing-name=s3
iceberg.rest-catalog.vended-credentials-enabled=false
fs.s3.enabled=true
s3.endpoint=http://rustfs:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:RUSTFS_ACCESS_KEY}
s3.aws-secret-key=${ENV:RUSTFS_SECRET_KEY}
